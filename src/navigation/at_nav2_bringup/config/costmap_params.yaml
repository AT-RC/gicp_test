costmap:
  costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.3, -0.15], [-0.3, 0.15], [0.3, 0.15], [0.3, -0.15]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::IntensityVoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        z_voxels: 16
        origin_z: 0.0
        z_resolution: 0.05
        unknown_threshold: 5
        mark_threshold: 0
        combination_method: 1
        observation_sources: terrain_map
        terrain_map:
          topic: /terrain_map
          data_type: PointCloud2
          sensor_frame: map # 测试模式下使用 map
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          # 高度过滤核心参数：基于雷达坐标系，过滤掉低于 -0.1m 的物体(5cm 减速带)，保留 25cm 箱子
          min_obstacle_height: -0.1
          max_obstacle_height: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        footprint_clearing_enabled: True
        inflation_radius: 0.20  # 缩小膨胀半径，允许通过狭窄缝隙
        cost_scaling_factor: 15.0 # 提高代价下降速度

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[-0.3, -0.15], [-0.3, 0.15], [0.3, 0.15], [0.3, -0.15]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::IntensityVoxelLayer"
        enabled: True
        observation_sources: terrain_map
        terrain_map:
          topic: /terrain_map
          data_type: PointCloud2
          sensor_frame: base_link
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          min_obstacle_height: -0.1
          max_obstacle_height: 0.2
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        footprint_clearing_enabled: True
        inflation_radius: 0.20
        cost_scaling_factor: 15.0
